name: Deploy article-processor

on:
  push:
    branches: [main]
    paths: ['services/article-processor/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push image
        working-directory: services/article-processor
        run: |
          docker build \
            -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/my-rss/article-processor:${{ github.sha }} \
            -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/my-rss/article-processor:latest \
            .
          docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/my-rss/article-processor:${{ github.sha }}
          docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/my-rss/article-processor:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy article-processor \
            --image us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/my-rss/article-processor:${{ github.sha }} \
            --region us-central1 \
            --service-account article-processor-sa@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --no-allow-unauthenticated \
            --min-instances 0 \
            --max-instances 5 \
            --quiet
