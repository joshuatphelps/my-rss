# Pub/Sub topic + push subscription for the article processing pipeline.
#
# Setup commands:
#   gcloud pubsub topics create raw-articles
#
#   gcloud pubsub subscriptions create raw-articles-processor \
#     --topic=raw-articles \
#     --push-endpoint="${ARTICLE_PROCESSOR_URL}" \
#     --push-auth-service-account="${PUBSUB_SA}@${PROJECT_ID}.iam.gserviceaccount.com" \
#     --ack-deadline=60 \
#     --max-delivery-attempts=5
#
# Required IAM:
#   - Pub/Sub SA needs roles/run.invoker on the article-processor Cloud Run service
#   - feed-fetcher service account needs roles/pubsub.publisher on the raw-articles topic

topic: raw-articles
subscription:
  name: raw-articles-processor
  pushEndpoint: "${ARTICLE_PROCESSOR_URL}"
  ackDeadlineSeconds: 60
  maxDeliveryAttempts: 5
